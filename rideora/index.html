<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Rideora is a white-label cab, van and chauffeur booking website with a full CMS portal: online booking, fixed fares, dispatch, fleet, drivers, pricing, promotions and branding. Built by Fascinora.">
<link rel="canonical" href="https://fascinora.com/rideora/">
<meta property="og:site_name" content="Fascinora">
<meta property="og:title" content="Rideora | White-label cab booking website and CMS by Fascinora">
<meta property="og:description" content="Online cab, van and chauffeur booking with fixed fares, plus a CMS for bookings, dispatch, fleet, pricing and branding. Try the live demo.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fascinora.com/rideora/">
<meta property="og:image" content="https://fascinora.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFC62B">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'self'">
<title>Rideora cab booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/*
VOICE: confident, international, calm. A premium chauffeur service, not a discount app.
IDEA: the street at kerbside: a bright brand-coloured band, a road panorama, a booking card like a ticket.
PICTURE: a wide road scene with the fleet driving across, the booking card sitting on top of it.
COLOUR and TYPE: brand colour field (default cab yellow, set in the CMS), ink black, white. Plus Jakarta Sans.
LAYOUT: site = header, hero band with booking card, sections; CMS = sidebar + work area, tables stack on phones.
*/
:root{--p:#FFC62B;--onp:#121417;--pd:color-mix(in srgb,var(--p) 78%,#000);--pl:color-mix(in srgb,var(--p) 16%,#fff);
--ink:#121417;--body:#3A3F47;--muted:#6B717B;--line:#E2E4E8;--soft:#F5F6F7;--white:#fff;
--ok:#16834F;--okb:#E3F4EA;--warn:#A86400;--warnb:#FFF1D6;--bad:#C23A32;--badb:#FCE6E4;--info:#2457D6;--infob:#E4ECFD;--vio:#6D3FC8;--viob:#EEE6FB;--trip:#0E7C86;--tripb:#DDF3F4;
--f:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;--r:14px;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.55 var(--f);overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.1;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(4vw,16px)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s,background .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--p);color:var(--onp)}.btn.p:hover{background:var(--pd);color:#fff}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#000}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.danger{background:var(--badb);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.demo{background:var(--ink);color:#fff;font-size:13.5px;text-align:center;padding:7px 16px}
.demo a{color:var(--p);font-weight:700}
/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.03em;text-decoration:none}
.mark{width:34px;height:34px;border-radius:10px;background:var(--p);display:grid;place-items:center;color:var(--onp);flex:none}
.mark svg{width:22px;height:22px}
.nav{display:flex;gap:26px;font-size:15px;font-weight:500;color:var(--body)}
.nav a{text-decoration:none}.nav a:hover{color:var(--ink)}
.menu{display:none;width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer}
@media(max-width:900px){.nav{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;flex-direction:column;gap:0;border-bottom:1px solid var(--line);padding:8px max(4vw,16px) 16px}.nav.open{display:flex}.nav a{padding:12px 0;border-bottom:1px solid var(--soft)}.menu{display:inline-grid;place-items:center}.hide-sm{display:none}}
/* hero */
.hero{background:var(--p);color:var(--onp);position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:2;padding-top:clamp(36px,6vw,72px)}
.hero-copy{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px 48px;align-items:end;margin-bottom:28px}
.hero h1{font-size:clamp(34px,5vw,52px);font-weight:800;line-height:1.05;max-width:16ch}
.hero .lead{font-size:18px;line-height:1.5;max-width:46ch;opacity:.86}
.ticks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-weight:600;font-size:14.5px}
.ticks span{display:inline-flex;gap:6px;align-items:center}
.ticks .ic{width:18px;height:18px;stroke-width:2.4}
@media(max-width:760px){.hero-copy{grid-template-columns:1fr}}
.bk{background:#fff;color:var(--ink);border-radius:20px;box-shadow:0 24px 60px -24px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.06);padding:8px 8px 14px;position:relative}
.tabs{display:flex;gap:4px;padding:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:transparent;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--body);display:inline-flex;gap:7px;align-items:center;min-height:40px}
.tabs button .ic{width:18px;height:18px}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.bk-grid{display:grid;grid-template-columns:minmax(0,1.5fr) auto minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,.7fr) minmax(0,.7fr) auto;gap:8px;padding:6px 8px 0;align-items:end}
.bk-grid.hourly .f-drop,.bk-grid.hourly .swap{display:none}
.bk-grid:not(.hourly) .f-hours{display:none}
.bk-ret{display:grid;grid-template-columns:repeat(2,minmax(0,200px));gap:8px;padding:8px 8px 0}
.fld{display:flex;flex-direction:column;gap:4px;background:var(--soft);border-radius:12px;padding:8px 12px;border:1px solid transparent}
.fld:focus-within{border-color:var(--ink);background:#fff}
.fld span{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select{border:0;background:transparent;font-size:16px;font-weight:600;padding:2px 0;outline:none;width:100%}
.swap{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;margin-bottom:8px}
.bk-go{height:58px;padding:0 26px;font-size:16px}
.bk-err{color:var(--bad);font-weight:600;font-size:14px;padding:10px 14px 0}
@media(max-width:1060px){.bk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bk-grid .bk-go{grid-column:1/-1}.bk-grid .f-pick,.bk-grid .f-drop{grid-column:1/-1}.swap{display:none}.bk-grid .f-pax,.bk-grid .f-bags{grid-column:auto}}
.bk-grid.hourly .f-hours{grid-column:1/-1}
@media(min-width:1061px){.bk-grid.hourly{grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,.7fr) minmax(0,.7fr) auto}.bk-grid.hourly .f-hours{grid-column:auto}}
.scene{display:block;width:100%;height:clamp(150px,22vw,260px);margin-top:-40px;position:relative;z-index:1}
.lane{stroke-dasharray:44 36;animation:drive 1.6s linear infinite}
@keyframes drive{to{stroke-dashoffset:-80}}
@media(prefers-reduced-motion:reduce){.lane{animation:none}}
/* sections */
.sec{padding:clamp(56px,8vw,96px) 0}
.sec.soft{background:var(--soft)}
.sh{max-width:640px;margin-bottom:36px}
.sh h2{font-size:clamp(30px,3.6vw,42px);font-weight:800}
.sh p{color:var(--muted);font-size:17px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:960px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid3,.grid4{grid-template-columns:1fr}}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .bubble,.svc .bubble{width:44px;height:44px;border-radius:12px;background:var(--pl);display:grid;place-items:center;flex:none;color:var(--ink)}
.feat h3{font-size:17px}.feat p{color:var(--muted);font-size:15px;margin-top:4px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px}
.svc h3{font-size:19px}.svc p{color:var(--muted);font-size:15.5px}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.car{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.car .pic{background:linear-gradient(#fff 0 62%,var(--pl) 62%);padding:18px 18px 6px}
.car .pic svg{width:100%;height:auto;display:block}
.car .bd{padding:16px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.car h3{font-size:18px}
.car p{color:var(--muted);font-size:14.5px}
.specs{display:flex;gap:14px;color:var(--body);font-size:14px;font-weight:600}
.specs span{display:inline-flex;align-items:center;gap:5px}.specs .ic{width:17px;height:17px}
.from{margin-top:auto;padding-top:8px;font-size:14px;color:var(--muted)}.from b{color:var(--ink);font-size:18px;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{padding:28px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.step .bubble{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--p);display:grid;place-items:center;margin-bottom:18px}
.step h3{font-size:19px}.step p{color:var(--muted);margin-top:6px}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14.5px;font-weight:600}
.chip .ic{width:16px;height:16px}
.cov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
@media(max-width:860px){.cov{grid-template-columns:1fr}}
.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:16px 0;font-weight:700;font-size:17px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;line-height:1;font-weight:400}
.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--body);padding:0 0 18px;max-width:68ch}
.cta{background:var(--ink);color:#fff;border-radius:24px;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px}
.cta h2{font-size:clamp(28px,3.4vw,40px);font-weight:800}
.cta p{opacity:.75;margin-top:10px}
.cta .lines{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.cta .lines div{display:flex;gap:10px;align-items:center}
.cta form{display:flex;flex-direction:column;gap:10px}
.cta input,.cta textarea{width:100%;background:#22252b;border:1px solid #34383f;border-radius:12px;padding:12px 14px;color:#fff;font-size:16px}
.cta input::placeholder,.cta textarea::placeholder{color:#9aa0a8}
@media(max-width:860px){.cta{grid-template-columns:1fr}}
footer.foot{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:14.5px}
footer.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
/* overlay sheet */
.ov{position:fixed;inset:0;z-index:80;background:rgba(18,20,23,.5);display:flex;justify-content:flex-end}
.sheet{background:#fff;width:min(920px,100%);height:100%;display:flex;flex-direction:column}.sheet.anim{animation:slide .25s ease}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet.anim{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:20px}
.sheet-h small{display:block;color:var(--muted);font-size:13.5px;font-weight:500;letter-spacing:0;margin-top:2px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;flex:none}
.sheet-b{flex:1;overflow-y:auto;padding:20px}
.sheet-f{border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-f .tot{font-size:14px;color:var(--muted)}.sheet-f .tot b{display:block;font-size:22px;color:var(--ink)}
.trip{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:18px}
.trip b{font-weight:700}
.vlist{display:flex;flex-direction:column;gap:10px}
.vopt{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;cursor:pointer;background:#fff;text-align:left;width:100%}
.vopt:hover{border-color:var(--ink)}
.vopt[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.vopt svg.carsvg{width:150px;height:auto}
.vopt h3{font-size:17px}.vopt p{color:var(--muted);font-size:14px;margin:2px 0 6px}
.vopt .pr{text-align:right;font-weight:800;font-size:20px;white-space:nowrap}
.vopt .pr small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
@media(max-width:600px){.vopt{grid-template-columns:96px minmax(0,1fr);}.vopt svg.carsvg{width:96px}.vopt .pr{grid-column:2;text-align:left}}
.kmrow{display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:var(--warnb);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14.5px}
.kmrow .fld{background:#fff;width:140px}
.det{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:760px){.det{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .wide{grid-column:1/-1}
@media(max-width:520px){.form{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--body)}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-weight:500;background:#fff;color:var(--ink);width:100%}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.fl input[type=color]{padding:4px;height:46px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.h4{font-size:16px;font-weight:800;margin:22px 0 10px}
.ex{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
.ex small{color:var(--muted);display:block}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
.qty output{min-width:18px;text-align:center;font-weight:700}
.pays{display:flex;flex-direction:column;gap:8px}
.pay{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.pay:has(input:checked){border-color:var(--ink)}
.pay input{margin-top:4px;accent-color:var(--ink);width:18px;height:18px}
.pay small{display:block;color:var(--muted)}
.sum{background:var(--soft);border-radius:var(--r);padding:18px;position:sticky;top:0}
.sum h3{font-size:17px;margin-bottom:10px}
.bl{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14.5px}
.bl span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.bl.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:18px}
.promo{display:flex;gap:8px;margin-top:12px}.promo input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;text-transform:uppercase}
.note{font-size:13.5px;color:var(--muted);margin-top:8px}
.okmsg{color:var(--ok);font-weight:600;font-size:14px;margin-top:6px}.errmsg{color:var(--bad);font-weight:600;font-size:14px;margin-top:6px}
.done{text-align:center;max-width:560px;margin:20px auto}
.done .big{width:72px;height:72px;border-radius:50%;background:var(--okb);color:var(--ok);display:grid;place-items:center;margin:0 auto 18px}
.done .big .ic{width:36px;height:36px;stroke-width:2.4}
.ref{font-size:30px;font-weight:800;letter-spacing:.04em;margin:8px 0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;text-align:left;background:var(--soft);border-radius:var(--r);padding:16px 18px;margin:18px 0;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.tl{display:flex;gap:0;margin:18px 0;flex-wrap:wrap}
.tl div{flex:1;min-width:80px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);position:relative;padding-top:24px}
.tl div::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.tl div.on{color:var(--ink)}.tl div.on::before{background:var(--ink)}
/* badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.s-Pending{background:var(--warnb);color:var(--warn)}.s-Confirmed{background:var(--infob);color:var(--info)}.s-Assigned{background:var(--viob);color:var(--vio)}.s-On-trip{background:var(--tripb);color:var(--trip)}.s-Completed{background:var(--okb);color:var(--ok)}.s-Cancelled{background:var(--badb);color:var(--bad)}
.s-Available{background:var(--okb);color:var(--ok)}.s-Maintenance,.s-Off-duty{background:var(--soft);color:var(--muted)}.s-New{background:var(--warnb);color:var(--warn)}.s-Handled{background:var(--soft);color:var(--muted)}.s-Active{background:var(--okb);color:var(--ok)}.s-Inactive{background:var(--soft);color:var(--muted)}
/* modal & toast */
.md{position:fixed;inset:0;z-index:90;background:rgba(18,20,23,.5);display:grid;place-items:center;padding:16px}
.md-c{background:#fff;border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.md-c.wide{width:min(860px,100%)}
.md-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.md-h h3{font-size:20px}
.md-f{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:100;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
/* admin */
.adm{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;background:var(--soft)}
.side{background:var(--ink);color:#d9dce1;padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{color:#fff;font-size:19px;padding:4px 8px}
.side .brand small{font-size:12px;font-weight:700;background:#2a2e35;color:var(--p);padding:2px 8px;border-radius:999px;letter-spacing:0}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#c4c8cf;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;min-height:42px}
.side nav button:hover{background:#1f2227;color:#fff}
.side nav button[aria-current=page]{background:var(--p);color:var(--onp)}
.side nav .ic{width:19px;height:19px}
.side nav .cnt{margin-left:auto;background:#2f333a;color:#fff;font-size:12px;border-radius:999px;padding:1px 8px}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px}
.side-f a,.side-f button{color:#c4c8cf;background:none;border:0;text-align:left;padding:8px 4px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}
.side-f a:hover,.side-f button:hover{color:#fff}
.am{padding:24px clamp(16px,3vw,36px) 48px}
.am-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.am-h h1{font-size:clamp(24px,3vw,30px);font-weight:800}
.am-h p{color:var(--muted);font-size:14.5px;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card+.card{margin-top:16px}.two>.card{margin-top:0}
.card h2{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi span{font-size:14px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap}
.kpi small{font-size:13px;font-weight:600}.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:24px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:13px;color:var(--muted)}
.bars i{display:block;width:100%;max-width:34px;background:var(--p);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
.bars i b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:13px;color:var(--ink);padding-bottom:3px}
.bars div.today i{background:var(--ink)}
@media(max-width:520px){.bars{gap:3px}.bars i b{display:none}}
.hb{display:flex;flex-direction:column;gap:12px}
.hb div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px;font-weight:600}
.hb div>i{grid-column:1/-1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden;display:block}
.hb div>i>i{display:block;height:100%;background:var(--ink);border-radius:99px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--soft);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fafafa}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td small{display:block;color:var(--muted);font-size:13px}
.tbl .acts{white-space:nowrap;text-align:right}
.lnk{background:none;border:0;color:var(--info);font-weight:700;cursor:pointer;padding:6px;font-size:14px}
.lnk.del{color:var(--bad)}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filt input,.filt select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;background:#fff;min-height:44px}
.filt input{flex:1;min-width:180px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:#eceef1;border-radius:var(--r);padding:12px;min-height:200px}
.col h3{font-size:15px;display:flex;justify-content:space-between;margin:2px 4px 12px}
.tk{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--line);cursor:pointer;font-size:14px;display:flex;flex-direction:column;gap:4px}
.tk:hover{border-color:var(--ink)}
.tk .t{font-weight:800;font-size:15px}
.tk small{color:var(--muted)}
.tk .btn{margin-top:6px;align-self:flex-start}
.login{min-height:100vh;display:grid;place-items:center;background:var(--p);padding:16px}
.login .card{width:min(420px,100%);padding:28px}
.login h1{font-size:26px;font-weight:800;margin:18px 0 6px}
.login p{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.hint{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:14px;color:var(--body)}
.prev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prev .ph{background:var(--p);color:var(--onp);padding:18px}
.prev .ph b{font-size:20px}
.prev .pb{padding:16px;display:flex;gap:8px;flex-wrap:wrap}
.presets{display:flex;gap:8px;flex-wrap:wrap}
textarea.code{width:100%;min-height:180px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 14px}
@media(max-width:860px){.adm{grid-template-columns:1fr}.side{position:sticky;top:0;height:auto;z-index:30;flex-direction:row;align-items:center;padding:8px;gap:8px;overflow:visible}.side .brand{display:none}.side nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1}.side nav button{flex:none}.side nav .cnt{display:none}.side-f{display:none}}
@media(max-width:640px){.stack thead{display:none}.stack tr{display:grid;padding:10px 0;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start!important}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--muted);font-size:13px;font-weight:600}.stack td:empty{display:none}.stack td.acts{padding-inline-start:0}.stack td.acts::before{display:none}}

 if(k==='content'){['heroTitle','heroSub','about'].forEach(n=>S.content[n]=f.elements[n].value.trim()||S.content[n]);save();toast('Content saved');return}
 if(k==='brand'){['name','tagline','city','phone','whatsapp','email','address','primary','currency','locale'].forEach(n=>S.brand[n]=f.elements[n].value.trim());S.brand.name=S.brand.name||'Rideora';save();renderAdmin();toast('Branding saved');return}
 if(k==='acct'){const em=f.elements.email.value.trim(),p=f.elements.pass.value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){toast('Enter a valid email');return}if(p&&p.length<6){toast('Use at least 6 characters');return}S.admin.email=em;if(p)S.admin.pass=p;save();toast('Login updated');return}
 if(k==='bedit'){const b=S.bookings.find(x=>x.ref===f.dataset.ref),d=f.elements.driver.value,v=f.elements.vehicle.value,st=f.elements.status.value,n=f.elements.note.value.trim();
  if(['Assigned','On trip'].includes(st)&&!d){toast('Choose a driver first');return}
  if(d!==b.driver){b.driver=d;b.log.push({t:new Date().toISOString(),m:d?'Driver '+drvOf(d).name+' assigned':'Driver removed'})}
  if(v!==b.vehicle){b.vehicle=v;if(v)b.log.push({t:new Date().toISOString(),m:'Vehicle '+vehOf(v).plate+' assigned'})}
  setStatus(b,st);if(n)b.log.push({t:new Date().toISOString(),m:n});save();closeLayer();renderAdmin();toast('Booking updated');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML)closeLayer()});
function route(){const h=location.hash.slice(1);
 if(h==='admin'){closeLayer();mode='admin';renderAdmin();window.scrollTo(0,0);return}
 if(mode!=='site'){mode='site';closeLayer();renderSite()}
 const el=h&&document.getElementById(h);if(el){el.scrollIntoView();if(h==='book')setTimeout(()=>$('#book input[name=pickup]')?.focus({preventScroll:true}),50)}
 $('#nav')?.classList.remove('open')}
new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document.body,{childList:true,subtree:true});
addEventListener('hashchange',route);
addEventListener('storage',e=>{if(e.key===KEY){try{S=JSON.parse(e.newValue)}catch(_){}if(mode==='admin'&&!$('#layer').innerHTML)renderAdmin()}});
route();
}
</script>
